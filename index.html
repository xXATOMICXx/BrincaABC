
<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrincaABC - Aprenda Brincando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(0); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating-shape {
            animation: float 6s ease-in-out infinite;
        }
        
        /* Efeito de Rachadura */
        .crack-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            height: 3px;
            transform-origin: left;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        
        @keyframes crack-glow {
            0%, 100% { opacity: 0.2; transform: scaleX(0.9); }
            50% { opacity: 0.8; transform: scaleX(1.1); }
        }
        .crack-animate {
            animation: crack-glow 4s infinite ease-in-out;
        }

        /* Efeito de Estilhaçar (Shatter) */
        @keyframes shatter-out {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(2); opacity: 0; filter: blur(10px); }
        }
        .shatter-effect {
            animation: shatter-out 0.8s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        .page-transition-enter {
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .star-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .star-overlay.active {
            opacity: 1;
        }
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
